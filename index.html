<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moja Stronka Pomocnik</title>
  <style>
    :root {
      --bg-color: #f9f9f9;
      --text-color: #222;
      --accent-color: #007bff;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
    }

    header {
      background-color: var(--accent-color);
      color: white;
      padding: 1rem;
      text-align: center;
    }

    main {
      padding: 1rem;
    }

    section {
      background: white;
      margin-bottom: 1rem;
      padding: 1rem;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    h2 {
      margin-top: 0;
    }

    footer {
      text-align: center;
      padding: 1rem;
      font-size: 0.9rem;
      color: #666;
    }

    @media (min-width: 600px) {
      main {
        max-width: 600px;
        margin: auto;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>💡 Mój Pomocnik</h1>
  </header>

  <main>
    <section>
      <h2>📌 Notatki</h2>
      <ul>
        <li>Sprawdzić maila</li>
        <li>Odebrać paczkę</li>
        <li>Pomysł na projekt 📱</li>
      </ul>
    </section>

    <section>
      <h2>🔗 Szybkie Linki</h2>
      <ul>
        <li><a href="https://gmail.com" target="_blank">Gmail</a></li>
        <li><a href="https://github.com" target="_blank">GitHub</a></li>
        <li><a href="https://chat.openai.com" target="_blank">ChatGPT</a></li>
      </ul>
    </section>

    <section>
      <h2>🧠 Przypomnienia</h2>
      <p>Dokończyć aplikację, zrobić backup, umówić wizytę.</p>
    </section>
  </main>

  <footer>
    Stworzone przez mnie ✌️
  </footer>
</body>
</html>
